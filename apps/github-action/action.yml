name: Gyde Security Scan
description: Analyze the dependencies, licenses and engine compatibility of a Unity or Unreal project with Gyde. Your source code never leaves the runner.
author: Gyde
branding:
  icon: shield
  color: green

inputs:
  api-key:
    description: Gyde API key. Store it as an encrypted repository secret.
    required: true
  api-url:
    description: Base URL of the Gyde API.
    required: true
  project-path:
    description: Folder of the game project, relative to the workspace.
    required: false
    default: '.'
  fail-on:
    description: Minimum severity that fails the step (critical, high, medium, low or none).
    required: false
    default: high
  include-ai:
    description: Ask for the AI explanations (needs an LLM key configured in your Gyde account).
    required: false
    default: 'true'
  comment-on-pr:
    description: Post the report as a pull request comment (one comment, updated on every run).
    required: false
    default: 'true'
  fail-on-degraded:
    description: Fail the step when the report is degraded (the AI layer could not run). By default it is only a warning.
    required: false
    default: 'false'
  github-token:
    description: Token used to comment on the pull request. The workflow needs the pull-requests write permission.
    required: false
    default: ${{ github.token }}

outputs:
  analysis-id:
    description: Id of the Gyde analysis.
  risk-score:
    description: Risk score from 0 to 100 (empty when the severity layer did not run).
  degraded:
    description: Whether the report is degraded ("true" or "false").

runs:
  using: node24
  main: dist/index.js

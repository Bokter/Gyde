packages:
  - apps/*
  - services/*
  - packages/*

# pnpm 11 fails the install when a dependency has an install script that was not approved.
# esbuild (pulled by tsx, tsup and vite) only validates and optimizes its native binary.
allowBuilds:
  esbuild: true

# Single version policy: every workspace package references these with "catalog:".
# Bump a version here once and the whole monorepo follows.
catalog:
  '@types/node': ^26.6.4
  fastify: ^5.12.5
  pino: ^10.4.0
  tsup: ^8.5.1
  tsx: ^4.23.15
  # typescript-eslint does not support TypeScript >= 6.1 yet; revisit when it does.
  typescript: ~6.0.3
  vitest: ^5.0.3
  zod: ^4.6.5
